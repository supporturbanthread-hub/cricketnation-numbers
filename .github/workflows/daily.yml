name: Daily refresh and deploy

on:
  schedule:
    - cron: '10 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['README.md']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download Cricsheet
        run: |
          mkdir -p cricsheet/tests cricsheet/odis
          curl -fsSL --retry 3 -o tests.zip https://cricsheet.org/downloads/tests_json.zip
          curl -fsSL --retry 3 -o odis.zip https://cricsheet.org/downloads/odis_json.zip
          unzip -q -o tests.zip -d cricsheet/tests
          unzip -q -o odis.zip -d cricsheet/odis

      - name: Refresh figures
        run: node refresh.mjs cricsheet

      - name: Build page
        run: |
          mkdir -p public
          node build.mjs public/index.html

      - name: Save refreshed figures to the repo
        run: |
          if ! git diff --quiet data.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -m "Refresh figures from Cricsheet"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
